# Hexo 配置文件
## 文档: https://hexo.io/docs/configuration.html
## 源码: https://github.com/hexojs/hexo/

# 网站基本信息
title: YGER's Blog              # 网站标题
subtitle: ' 「感受峰 感受存在」'                    # 网站副标题
description: '这是网站描述：YGER的博客'                 # 网站描述
keywords:                       # 网站关键词
author: YGER                    # 作者名称
language: zh-CN                 # 网站语言
timezone: ''                    # 时区，留空则使用系统时区

# URL 设置
## 如果网站放在子目录中，设置 url 为 'http://yoursite.com/child' 并设置 root 为 '/child/'
url: https://YGER2000.github.io # 网站地址
root: /                         # 网站根目录
permalink: :year/:month/:day/:title/  # 文章永久链接格式
permalink_defaults:
pretty_urls:
  trailing_index: true          # 设为 false 可以去掉链接中的 'index.html'
  trailing_html: true           # 设为 false 可以去掉链接中的 '.html'

# 目录设置
source_dir: source              # 源文件目录
public_dir: public              # 生成的静态文件目录
tag_dir: tags                   # 标签目录
archive_dir: archives           # 归档目录
category_dir: categories        # 分类目录
code_dir: downloads/code        # 代码下载目录
i18n_dir: :lang                 # 国际化目录
skip_render:                    # 跳过渲染的文件

# 写作设置
new_post_name: :title.md        # 新文章的文件名格式
default_layout: post            # 默认布局
titlecase: false                # 是否将标题转换为首字母大写
external_link:
  enable: true                  # 在新标签页中打开外部链接
  field: site                   # 应用于整个网站
  exclude: ''                   # 排除的域名
filename_case: 0                # 文件名大小写转换（0=不转换，1=小写，2=大写）
render_drafts: false            # 是否渲染草稿
post_asset_folder: false        # 是否启用文章资源文件夹
relative_link: false            # 是否使用相对链接
future: true                    # 是否显示未来日期的文章
highlight:                      # 代码高亮设置
  enable: true                  # 启用代码高亮
  line_number: true             # 显示行号
  auto_detect: false            # 自动检测语言
  tab_replace: ''               # Tab 替换
  wrap: true                    # 代码换行
  hljs: false                   # 使用 highlight.js
prismjs:                        # Prism.js 代码高亮设置
  enable: false                 # 启用 Prism.js
  preprocess: true              # 预处理
  line_number: true             # 显示行号
  tab_replace: ''               # Tab 替换

# 首页设置
# path: 博客首页的根路径（默认为 ''）
# per_page: 每页显示的文章数量（0 = 禁用分页）
# order_by: 文章排序方式（默认按日期降序）
index_generator:
  path: ''                      # 首页路径
  per_page: 10                  # 每页显示 10 篇文章
  order_by: -date               # 按日期降序排列

# 分类 & 标签
default_category: uncategorized # 默认分类
category_map:                   # 分类别名映射
tag_map:                        # 标签别名映射

# 元数据设置
## https://developer.mozilla.org/zh-CN/docs/Web/HTML/Element/meta
meta_generator: true            # 是否在 HTML 中插入生成器标签

# 日期 / 时间格式
## Hexo 使用 Moment.js 来解析和显示日期
## 你可以自定义日期格式，参考：
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD         # 日期格式
time_format: HH:mm:ss           # 时间格式
## updated_option 支持 'mtime'（文件修改时间）、'date'（文章日期）、'empty'（不显示）
updated_option: 'mtime'         # 更新时间选项

# 分页设置
## 设置 per_page 为 0 可以禁用分页
per_page: 10                    # 每页显示 10 篇文章
pagination_dir: page            # 分页目录

# 包含 / 排除文件
## include:/exclude: 选项仅适用于 'source/' 文件夹
include:                        # 包含的文件
exclude:                        # 排除的文件
ignore:                         # 忽略的文件

# 扩展
## 插件: https://hexo.io/plugins/
## 主题: https://hexo.io/themes/
theme: typing                   # 当前使用的主题

# 部署设置
## 文档: https://hexo.io/docs/one-command-deployment.html
deploy:
  type: git                     # 部署类型
  repo: https://github.com/YGER2000/YGER2000.github.io.git  # 仓库地址
  branch: gh-pages              # 部署分支